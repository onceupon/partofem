  :root {
    --cream: #FBF7EE;
    --ink: #3A3127;
    --muted: #8A7D6B;
    --gold: #D3AF37;
    --gold-soft: rgba(211, 175, 55, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Jaldi', system-ui, sans-serif;
    font-weight: 400;
    color: var(--ink);
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(232, 205, 120, 0.28), transparent 70%),
      radial-gradient(700px 500px at 100% 110%, rgba(214, 190, 150, 0.22), transparent 70%),
      var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 48px 24px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 340px;
    animation: rise 1.2s cubic-bezier(.2, .7, .2, 1) both;
  }
  .mark {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    overflow: hidden;
    background: #fffdf8;
    color: var(--gold);
    box-shadow:
      0 0 0 1px var(--gold-soft),
      0 0 0 8px rgba(255, 253, 248, 0.7),
      0 0 0 9px rgba(211, 175, 55, 0.18),
      0 18px 40px rgba(120, 95, 40, 0.16);
  }
  .mark img { display: block; width: 100%; height: 100%; }
  /* Mirror shine: a light streak sweeps corner to corner on hover. */
  .mark { position: relative; }
  .mark::after {
    content: '';
    position: absolute;
    inset: -30%;
    background: linear-gradient(135deg,
      transparent 38%,
      rgba(255, 255, 255, 0.10) 44%,
      rgba(255, 255, 255, 0.85) 50%,
      rgba(255, 255, 255, 0.10) 56%,
      transparent 62%);
    transform: translate(-70%, -70%);
    pointer-events: none;
    animation: shine 1.1s 0.9s cubic-bezier(.3, .1, .3, 1) backwards;
  }
  @keyframes shine { from { transform: translate(-70%, -70%); } to { transform: translate(70%, 70%); } }
  .mark:hover::after {
    transform: translate(70%, 70%);
    transition: transform 0.9s cubic-bezier(.3, .1, .3, 1);
  }
  h1 {
    font-weight: 400;
    font-size: 48px;
    line-height: 1;
    letter-spacing: 0.08em;
    margin: 34px 0 8px;
    padding-left: 0.08em;
  }
  .sub {
    margin: 0 0 32px;
    font-size: 15px;
    letter-spacing: 0.1em;
    padding-left: 0.1em;
    color: #B08D2A;
  }
  nav { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  nav a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 22px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    border: 1px solid rgba(211, 175, 55, 0.32);
    color: var(--ink);
    text-decoration: none;
    font-size: 17px;
    box-shadow: 0 2px 10px rgba(120, 95, 40, 0.06);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  nav a:hover, nav a:focus-visible {
    transform: translateY(-2px);
    background: #fff;
    border-color: var(--gold);
    box-shadow: 0 8px 22px rgba(120, 95, 40, 0.12);
    outline: none;
  }
  nav a svg { width: 22px; height: 22px; flex: none; color: var(--gold); }
  nav a span { flex: 1; }
  nav a .arrow { width: 16px; height: 16px; color: var(--muted); opacity: .7; }
  footer {
    margin-top: 44px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .mark::after { display: none; }
    nav a { transition: none; }
  }
